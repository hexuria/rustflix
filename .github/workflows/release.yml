# Release builds of rustflix: Android APKs/AAB, the macOS app and (when its
# signing secrets exist) the iOS IPA, published as a GitHub Release.
#
#   push tag v*        -> release "vX.Y.Z" (the tag must equal MARKETING_VERSION)
#   push to main       -> rolling pre-release "latest", replaced on every run
#   workflow_dispatch  -> pick targets; artifacts only unless `publish`
#
# Secrets, versions and how to cut a release: docs/RELEASING.md.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "store/**"
  workflow_dispatch:
    inputs:
      android:
        description: Build Android
        type: boolean
        default: true
      macos:
        description: Build macOS
        type: boolean
        default: true
      ios:
        description: Build iOS (only when its signing secrets exist)
        type: boolean
        default: true
      publish:
        description: Publish to the rolling "latest" pre-release (main only)
        type: boolean
        default: false
      allow_debug_signing:
        description: Without the Android keystore secrets, sign with a throwaway key (test runs; cannot be published)
        type: boolean
        default: false
      testflight:
        description: Upload the IPA to TestFlight (needs the App Store Connect API key secrets)
        type: boolean
        default: false

# Superseded runs on main are cancelled; tag runs always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The NSH repository (public) the Android runtime and NativeShell.xcframework
  # are built from. Bump deliberately; the runtime caches are keyed by it.
  NSH_REPO: https://github.com/longbridge/nsh.git
  NSH_REF: a7addd84bb5f4dbfc6979549cc7429517e9bdca9
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      channel: ${{ steps.v.outputs.channel }}
      release_tag: ${{ steps.v.outputs.release_tag }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check inputs
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.allow_debug_signing &&
          (inputs.publish || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "::error::allow_debug_signing cannot be used with publish or on a tag: throwaway-key APKs must never be published."
          exit 1
      - name: Read version from ios/project.yml
        id: v
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: .github/scripts/version.sh

  android:
    name: Android
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.android
    runs-on: macos-26
    timeout-minutes: 120
    env:
      ABIS: arm64-v8a,armeabi-v7a
      # android/app/build.gradle.kts `ndkVersion`; NSH's xtask and build.sh use ANDROID_NDK_HOME.
      NDK_VERSION: 29.0.13113456
      PREFIX: ${{ needs.version.outputs.prefix }}
    outputs:
      signing: ${{ steps.signing.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager=$(command -v sdkmanager)
          yes | "$sdkmanager" --licenses >/dev/null || true
          # platforms;android-35: NSH's runtime compiles against it (COMPILE_SDK).
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --target aarch64-linux-android,armv7-linux-androideabi
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          workspaces: |
            . -> target
            android/rustflix-dl -> target
          save-if: ${{ github.event_name == 'push' }}

      - name: Cache the NSH Android runtime
        id: nsh-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/nsh-runtime
          key: nsh-android-${{ env.NSH_REF }}-${{ env.ABIS }}-ndk${{ env.NDK_VERSION }}-v1

      - name: Check out NSH
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        run: |
          dir="$GITHUB_WORKSPACE/../_research/nsh"
          mkdir -p "$dir" && cd "$dir"
          git init -q
          git fetch -q --depth 1 "$NSH_REPO" "$NSH_REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='NSH %H %s'

      - name: Release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_DEBUG_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_debug_signing }}
        run: .github/scripts/android-signing.sh

      - name: Build (android/build.sh release-splits)
        env:
          SKIP_RUNTIME: ${{ steps.nsh-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          NSH_DIR: ${{ github.workspace }}/../_research/nsh
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          RUSTFLIX_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUSTFLIX_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android/build.sh release-splits

      - name: Collect and verify
        env:
          SIGNING: ${{ steps.signing.outputs.signing }}
        run: |
          suffix=""
          [ "$SIGNING" = "debug" ] && suffix="-testkey"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          out=android/app/build/outputs
          mkdir -p dist
          IFS=, read -ra abis <<<"$ABIS"
          for abi in "${abis[@]}"; do
            apk="$out/apk/release/app-$abi-release.apk"
            [ -f "$apk" ] || { echo "::error::$apk missing (unsigned builds are named *-release-unsigned.apk)"; exit 1; }
            "$apksigner" verify --print-certs "$apk" | grep -E 'SHA-256' | head -1
            cp "$apk" "dist/$PREFIX-$abi$suffix.apk"
          done
          cp "$out/bundle/release/app-release.aab" "dist/$PREFIX$suffix.aab"
          ls -l dist

      - name: Remove signing material
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP"/rustflix-*.keystore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustflix-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-26
    timeout-minutes: 75
    env:
      PREFIX: ${{ needs.version.outputs.prefix }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          save-if: ${{ github.event_name == 'push' }}

      - name: App icon
        run: |
          set=$RUNNER_TEMP/rustflix.iconset
          mkdir -p "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s store/app-icon-1024.png --out "$set/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) store/app-icon-1024.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o "$RUNNER_TEMP/rustflix.icns"

      - name: Build rustflix.app (package-macos.sh)
        env:
          ICNS: ${{ runner.temp }}/rustflix.icns
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: |
          ./package-macos.sh "$RUNNER_TEMP/app"
          # package-macos.sh writes version 0.1.0 (1); stamp ios/project.yml's.
          plist="$RUNNER_TEMP/app/rustflix.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" -c "Set :CFBundleVersion $BUILD" "$plist"

      - name: Signing certificate
        id: keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "No MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD: the app will be ad-hoc signed."
            exit 0
          fi
          .github/scripts/apple-keychain.sh

      - name: Sign, notarize, zip
        id: sign
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p dist
          .github/scripts/macos-sign.sh "$RUNNER_TEMP/app/rustflix.app" "dist/$PREFIX-macos-arm64.zip"
          ls -l dist

      - name: Remove signing material
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustflix-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    runs-on: macos-26
    timeout-minutes: 120
    env:
      PREFIX: ${{ needs.version.outputs.prefix }}
    outputs:
      status: ${{ steps.gate.outputs.status }}
      method: ${{ steps.build.outputs.method }}
    steps:
      - name: Signing secrets present?
        id: gate
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROFILE" ]; then
            echo "status=built" >>"$GITHUB_OUTPUT"
          else
            echo "status=no-secrets" >>"$GITHUB_OUTPUT"
            echo "::notice::iOS skipped: IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD and IOS_PROVISIONING_PROFILE_BASE64 are not all set (docs/RELEASING.md)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.status == 'built'
        with:
          persist-credentials: false

      - name: Rust
        if: steps.gate.outputs.status == 'built'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.gate.outputs.status == 'built'
        with:
          key: ios
          save-if: ${{ github.event_name == 'push' }}

      - name: Xcode version
        if: steps.gate.outputs.status == 'built'
        id: xcode
        run: |
          xcodebuild -version
          echo "id=$(xcodebuild -version | tr -d ' \n')" >>"$GITHUB_OUTPUT"

      # ios/project.yml links ../../_research/nsh/dist/nsh/embed/ios/NativeShell.xcframework
      # (relative to ios/), so NSH lives at ../_research/nsh next to the checkout.
      - name: Cache NativeShell.xcframework
        if: steps.gate.outputs.status == 'built'
        id: nsh-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../_research/nsh/dist/nsh/embed/ios
          key: nsh-ios-${{ env.NSH_REF }}-${{ steps.xcode.outputs.id }}-nodev-nocatalyst-v1

      - name: Build NativeShell.xcframework
        if: steps.gate.outputs.status == 'built' && steps.nsh-cache.outputs.cache-hit != 'true'
        run: |
          dir="$GITHUB_WORKSPACE/../_research/nsh"
          mkdir -p "$dir" && cd "$dir"
          git init -q
          git fetch -q --depth 1 "$NSH_REPO" "$NSH_REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='NSH %H %s'
          cargo xtask ios-embed --no-dev --no-catalyst

      - name: XcodeGen
        if: steps.gate.outputs.status == 'built'
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Signing certificate
        if: steps.gate.outputs.status == 'built'
        id: keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: .github/scripts/apple-keychain.sh

      - name: Archive and export IPA
        if: steps.gate.outputs.status == 'built'
        id: build
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: .github/scripts/ios-build.sh "dist/$PREFIX.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.status == 'built'
        with:
          name: rustflix-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # Opt-in: the dispatch input `testflight`, or the repository variable
      # IOS_TESTFLIGHT_UPLOAD=true for tag and main builds.
      - name: Upload to TestFlight
        if: >-
          steps.gate.outputs.status == 'built' && steps.build.outputs.method == 'app-store-connect' &&
          ((github.event_name == 'workflow_dispatch' && inputs.testflight) || vars.IOS_TESTFLIGHT_UPLOAD == 'true')
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::error::TestFlight upload needs APP_STORE_CONNECT_API_KEY_P8_BASE64, APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_ISSUER_ID."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" | tr -d ' \r\n' | base64 --decode >~/.appstoreconnect/private_keys/"AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app -t ios -f "dist/$PREFIX.ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Remove signing material
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/ios/profile.mobileprovision"

  release:
    name: Release
    needs: [version, android, macos, ios]
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.version.outputs.channel }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      ANDROID_RESULT: ${{ needs.android.result }}
      MACOS_RESULT: ${{ needs.macos.result }}
      IOS_RESULT: ${{ needs.ios.result }}
      ANDROID_SIGNING: ${{ needs.android.outputs.signing }}
      MACOS_SIGNING: ${{ needs.macos.outputs.signing }}
      IOS_STATUS: ${{ needs.ios.outputs.status }}
      IOS_METHOD: ${{ needs.ios.outputs.method }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustflix-*
          path: dist
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          mkdir -p dist
          .github/scripts/release-notes.sh dist >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >>"$GITHUB_STEP_SUMMARY"
          ls -l dist

      - name: Publish
        if: env.CHANNEL != 'none'
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -le 1 ]; then
            echo "::error::No build succeeded: nothing to publish."
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          if [ "$CHANNEL" = "tag" ]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
              gh release edit "$RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag \
                --title "rustflix $VERSION" --notes-file "$notes"
            fi
          else
            # Move `latest` to this commit with only this run's assets.
            gh release delete latest --cleanup-tag --yes 2>/dev/null || true
            gh release create latest "${files[@]}" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "rustflix $VERSION ($BUILD), latest main" --notes-file "$notes"
          fi

      # Android and macOS are required; iOS is optional. Targets not selected
      # in a manual run are `skipped` and do not count.
      - name: Required targets
        run: |
          failed=()
          case "$ANDROID_RESULT" in failure|cancelled) failed+=(Android) ;; esac
          case "$MACOS_RESULT" in failure|cancelled) failed+=(macOS) ;; esac
          [ "$IOS_RESULT" = "failure" ] && echo "::warning::iOS failed (optional target)."
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Required target(s) failed: ${failed[*]}"
            exit 1
          fi
