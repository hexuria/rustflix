[package]
name = "rustflix"
description = "rustflix: a native streaming app — GPUI shell hosting an NSH (TSX) interface."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

# Its own workspace: GPUI (gpui-fast) stays out of any other workspace.
[workspace]

[dependencies]
nsh-platform-gpui = { version = "0.4.0", default-features = false, features = ["js", "webview", "runtime-shaders"] }
env_logger = "0.11"
log = "0.4"
# The `nsh/host` channel (`HostChannel`) behind the app's `cache.*` calls;
# the same nsh-engine nsh-platform-gpui builds on.
nsh-engine = { version = "0.4.0", default-features = false }
serde_json = "1"
# The built-in downloader (`src/dl`): HTTP with the same ureq (and its
# default rustls + gzip features) nsh-engine already builds, URL
# resolution, and the records/manifests as JSON. All already in the tree.
ureq = "3.5.1"
url = "2"
serde = { version = "1", features = ["derive"] }
# The FPS monitor's window root (src/perf.rs): GPUI's application, the
# same gpui-fast-platform nsh-platform-gpui builds on, and the channel that
# wakes it (both already in the tree).
gpui_platform = { package = "gpui-fast-platform", version = "0.1.10", default-features = false }
async-channel = "2"
# `fs.space` (statvfs) for the download folder's volume.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Linux player (src/player/linux): GStreamer decodes to BGRA frames,
# painted by GPUI through the image atlas. `image`/`smallvec` are already
# in the tree through gpui-fast.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.2"
image = "0.25.10"
smallvec = "1.16.5"
# The web views NSH builds through wry are GtkWidgets in this process:
# WebKitGTK's user content manager takes scripts that run in every frame
# (the all-frames media sniffer), its cookie manager answers
# `sys.webCookies`, and GTK's toplevel list finds the widgets. Both are
# already in the tree through lb-wry.
gtk = "0.18"
webkit2gtk = { version = "2.0.1", features = ["v2_40"] }

# The Windows player (src/player/win): Media Foundation's media engine
# decodes (part of Windows, nothing to install); frames go through a D3D11
# texture into GPUI's image atlas; the shell calls (`fs.*`: free space,
# the Recycle Bin, Explorer) are src/win/shell.rs. `windows` is the version
# gpui-fast-windows already builds; `image`/`smallvec` are in the tree
# through gpui-fast.
[target.'cfg(target_os = "windows")'.dependencies]
image = "0.25.10"
smallvec = "1.16.5"
windows-core = "0.62"
# The WebView2 web views (src/win/webview.rs): the bindings wry builds on,
# with the `windows` crates of their own version (all already in the tree).
webview2-com = "0.38"
# The content rules' URL filters (already in the tree).
regex = "1.13"
windows-61 = { package = "windows", version = "0.61", features = ["Win32_Foundation"] }
windows-core61 = { package = "windows-core", version = "0.61" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# `cache.clear` of web/site data through the web views' WKWebsiteDataStore
# (all already in the tree through wry).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDate", "NSError", "NSFileManager", "NSSet", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebsiteDataRecord", "WKWebsiteDataStore"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
# The native player spike (src/player): the video output's CVPixelBuffers,
# painted by GPUI (both already in the tree through gpui-fast).
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-video = { version = "0.3", default-features = false, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }

# `build.rs` bundles and compiles `app/` as `nsh build` does.
[build-dependencies]
nsh-bundler = { version = "0.4.0", features = ["bundle"] }
nsh-core = { version = "0.4.0" }
nsh-js = { version = "0.4.0" }
nsh-base = { version = "0.4.0" }
serde_json = "1"
# rolldown 1.2.13 (pinned by nsh-bundler) semver-allows rolldown_std_utils
# 1.3.x, which broke its API; pin the matching version.
rolldown_std_utils = "=1.2.13"

[profile.dev.package.quickjs-jit-sys]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3

# `PERF=1 ./package-macos.sh`: release, plus line tables and the symbol
# table, so the FPS monitor's spike stacks name file:line (`atos`). The
# default release build keeps the symbol table too (Cargo strips only debug
# info), so function names resolve there as well.
[profile.perf]
inherits = "release"
debug = "line-tables-only"
strip = "none"


# Linux draws macOS-style traffic lights (left side) for its client-side
# window decorations — a patch on top of the published 0.4.0 until it
# lands upstream in longbridge/nsh (branch linux-traffic-lights).
[patch.crates-io]
nsh-platform-gpui = { git = "https://github.com/hexuria/nsh", branch = "linux-traffic-lights" }
nsh-engine = { git = "https://github.com/hexuria/nsh", branch = "linux-traffic-lights" }
nsh-bundler = { git = "https://github.com/hexuria/nsh", branch = "linux-traffic-lights" }
nsh-core = { git = "https://github.com/hexuria/nsh", branch = "linux-traffic-lights" }
nsh-js = { git = "https://github.com/hexuria/nsh", branch = "linux-traffic-lights" }
nsh-base = { git = "https://github.com/hexuria/nsh", branch = "linux-traffic-lights" }
