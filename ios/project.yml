name: rustflix
options:
  bundleIdPrefix: com.hexuria
  deploymentTarget:
    iOS: "15.0"
targets:
  rustflix:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Rustflix
        excludes:
          - "nsh"
      - path: Rustflix/nsh
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../../_research/nsh/dist/nsh/embed/ios/NativeShell.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexuria.rustflix
        PRODUCT_NAME: rustflix
        # App Store requires both; bump CURRENT_PROJECT_VERSION per upload.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: rustflix
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Team that owns the "Apple Distribution: Goldcoders Corp" cert;
        # override locally if you sign with a different team.
        DEVELOPMENT_TEAM: "5KZ8MD34QW"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
